spring.application.name=TouristAnalytics
server.port=8080

# In-memory H2 database: no separate database installation required
spring.datasource.url=jdbc:h2:mem:tourismdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo token used for the practical
app.security.token=tourist123
